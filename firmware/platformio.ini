; ============================================================================
;  ESP8266 通用联网 / 配网模块 —— PlatformIO 工程
;
;  常用命令（在仓库根目录执行）：
;     pio run -d firmware                 # 编译
;     pio run -d firmware -t upload       # 通过 USB-TTL 烧录
;     pio device monitor -b 115200        # 看调试串口（UART1 / GPIO2）
;
;  注意：本机当前没有安装 PlatformIO，需要先 pip install platformio
;        （或用 VSCode 的 PlatformIO 插件打开 firmware/ 目录）
; ============================================================================

[platformio]
default_envs = esp12e

[env]
platform      = espressif8266
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600
build_flags =
    -DPROV_AP_SSID_PREFIX="\"MyDev-\""
    -DPROV_AP_PWD="\"12345678\""
    -DCFG_USE_DHCP_OPT114=1
    -DCFG_ENABLE_MDNS=1

; 默认目标：ESP-12F / ESP-12E（4MB Flash，串口脚全部引出，推荐）
[env:esp12e]
board = esp12e

; 换模组只改 board 这一行：nodemcuv2 / d1_mini / esp8285 / esp01_1m ...

; 1MB Flash 的模组（ESP-01S 等）：门户页走精简版
[env:esp01_1m]
board = esp01_1m
build_flags =
    ${env.build_flags}
    -DCFG_MINIMAL_UI=1
